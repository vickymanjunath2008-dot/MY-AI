<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MY AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ECECEC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex flex-col h-full bg-black text-[#ececec]">

  <!-- HEADER -->
  <header class="h-16 border-b border-[#1f1f1f] flex items-center justify-between px-4 z-20 bg-black/90 backdrop-blur-md shrink-0">
    <button onclick="toggleSidebar()" class="p-3 text-gray-300 hover:text-white rounded-xl active:bg-[#1a1a1a]">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
    
    <!-- Status Badges -->
    <div class="flex items-center space-x-2">
      <span id="headerModel" class="text-xs bg-[#171717] border border-[#2d2d2d] text-green-400 px-2.5 py-1 rounded-full font-medium">gemini-3.1-flash</span>
      <span id="turnCounter" class="text-xs bg-[#171717] border border-[#2d2d2d] text-gray-400 px-2.5 py-1 rounded-full">0/60</span>
    </div>

    <button onclick="toggleSettings()" class="p-3 text-gray-300 hover:text-white rounded-xl active:bg-[#1a1a1a]">
      <i data-lucide="settings" class="w-6 h-6"></i>
    </button>
  </header>

  <!-- CHAT AREA -->
  <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-6 w-full max-w-2xl mx-auto">
    <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center space-y-3 pt-32">
      <div class="w-14 h-14 rounded-full bg-[#171717] border border-[#262626] flex items-center justify-center shadow-lg">
        <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
      </div>
      <h2 class="text-xl font-semibold text-gray-200">How can I help you today?</h2>
      <p class="text-xs text-gray-500 max-w-xs">Enter your Gemini keys in settings to begin chatting.</p>
    </div>
  </main>

  <!-- MOBILE INPUT BAR (Fixed at Bottom, Large Touch Targets) -->
  <footer class="p-3 bg-black border-t border-[#1a1a1a] w-full max-w-2xl mx-auto safe-bottom shrink-0">
    <div class="flex items-end bg-[#171717] border border-[#2d2d2d] rounded-3xl px-3 py-2 shadow-2xl focus-within:border-gray-400">
      <button onclick="toggleSettings()" class="p-2 text-gray-400 hover:text-white rounded-full">
        <i data-lucide="paperclip" class="w-5 h-5"></i>
      </button>
      
      <!-- Auto-expanding input: Enter creates new line, send button submits -->
      <textarea id="promptInput" rows="1" placeholder="Message MY AI..." 
        class="flex-1 bg-transparent text-base text-white placeholder-gray-500 px-3 py-2 outline-none resize-none max-h-36 leading-normal"></textarea>

      <button id="sendBtn" onclick="sendMessage()" class="p-2.5 bg-white text-black rounded-full hover:bg-gray-200 active:scale-95 transition">
        <i data-lucide="arrow-up" class="w-5 h-5 stroke-[2.5]"></i>
      </button>
    </div>
  </footer>

  <!-- SIDEBAR (DRAWER) -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-30 hidden backdrop-blur-sm"></div>
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-80 bg-[#0d0d0d] border-r border-[#1f1f1f] z-40 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-[#1f1f1f] flex items-center justify-between">
      <button onclick="newChat()" class="flex-1 flex items-center justify-center space-x-2 bg-[#1a1a1a] border border-[#2d2d2d] hover:bg-[#222] text-white py-2.5 rounded-xl text-sm font-medium">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>New Chat</span>
      </button>
      <button onclick="toggleSidebar()" class="ml-3 p-2 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    
    <div class="flex-1 overflow-y-auto p-3 space-y-1" id="chatHistoryList"></div>

    <!-- User Account Pill -->
    <div onclick="toggleSettings()" class="p-4 border-t border-[#1f1f1f] flex items-center space-x-3 bg-[#121212] cursor-pointer">
      <div id="userAvatar" class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">VM</div>
      <div class="flex-1 truncate">
        <div id="userNameDisplay" class="font-medium text-sm text-white">Vikas M</div>
        <div class="text-[11px] text-gray-500">Tap for Settings & Keys</div>
      </div>
    </div>
  </aside>

  <!-- COMPREHENSIVE SETTINGS & VAULT DRAWER -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end sm:items-center justify-center backdrop-blur-md">
    <div class="bg-[#121212] border-t sm:border border-[#262626] rounded-t-3xl sm:rounded-2xl w-full max-w-lg h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-[#1f1f1f] flex justify-between items-center shrink-0">
        <h3 class="font-semibold text-base text-white">Settings & Vault</h3>
        <button onclick="toggleSettings()" class="p-2 text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>

      <div class="p-5 overflow-y-auto space-y-6 text-sm flex-1">
        <!-- Account Profile Section -->
        <div class="bg-[#1a1a1a] p-3.5 rounded-xl border border-[#2d2d2d] space-y-2">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Account Profile</label>
          <input id="userNameInput" type="text" placeholder="Your Name (e.g. Vikas M)" class="w-full bg-[#121212] border border-[#333] rounded-lg p-2.5 text-white outline-none">
        </div>

        <!-- Model Selection -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Model Selection</label>
          <select id="modelSelect" class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-xl p-3 text-white outline-none">
            <option value="gemini-3.1-flash">gemini-3.1-flash (Recommended)</option>
            <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (High Quota)</option>
            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
            <option value="gemini-3.7-flash">gemini-3.7-flash (Experimental)</option>
            <option value="gemini-3.8-flash">gemini-3.8-flash (Experimental)</option>
          </select>
        </div>

        <!-- Temperature & Groundedness Slider -->
        <div class="space-y-2">
          <div class="flex justify-between text-xs">
            <span class="font-semibold text-gray-400 uppercase">Grounded Realism vs Creativity</span>
            <span id="tempValue" class="text-white">0.6</span>
          </div>
          <input id="tempSlider" type="range" min="0.1" max="1.0" step="0.05" value="0.6" class="w-full accent-white" oninput="document.getElementById('tempValue').innerText = this.value">
        </div>

        <!-- Safety Filter (BLOCK_NONE) -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Safety Policy</label>
          <select id="safetySelect" class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-xl p-3 text-white outline-none">
            <option value="BLOCK_NONE">🔥 Unrestricted / Block None (Fiction & Action)</option>
            <option value="BLOCK_ONLY_HIGH">Block Only High Risk</option>
            <option value="BLOCK_MEDIUM_AND_ABOVE">Standard Filtering</option>
          </select>
        </div>

        <!-- Story Bible / Knowledge Vault -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Story Bible / Lore Vault (Direct Paste)</label>
          <textarea id="vaultInput" rows="4" placeholder="Paste your characters, world rules, Jersey Devil physiology, or past arcs here..." class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-xl p-3 text-xs text-white outline-none"></textarea>
        </div>

        <!-- API Key Pool -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Gemini API Key Pool (1 to 5 Keys)</label>
          <textarea id="apiKeysInput" rows="3" placeholder="Paste your API keys here (one per line)..." class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-xl p-3 text-xs text-white outline-none"></textarea>
        </div>

        <!-- Supabase Cloud Credentials -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Supabase Persistence</label>
          <input id="sbUrl" type="password" placeholder="Supabase Project URL" class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-lg p-2.5 text-xs text-white mb-2 outline-none">
          <input id="sbKey" type="password" placeholder="Supabase Anon Key" class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-lg p-2.5 text-xs text-white outline-none">
        </div>
      </div>

      <div class="p-4 border-t border-[#1f1f1f] bg-[#121212] shrink-0">
        <button onclick="saveAllSettings()" class="w-full bg-white text-black font-semibold py-3 rounded-xl hover:bg-gray-200 active:scale-98 transition text-sm">Save & Apply Settings</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let messages = [];
    let currentChatId = crypto.randomUUID();
    let apiKeys = [];
    let activeKeyIndex = 0;
    let supabaseClient = null;

    window.onload = () => {
      loadStoredSettings();
    };

    function loadStoredSettings() {
      const keys = localStorage.getItem('my_ai_keys') || '';
      const url = localStorage.getItem('my_sb_url') || '';
      const sbKey = localStorage.getItem('my_sb_key') || '';
      const vault = localStorage.getItem('my_vault') || '';
      const model = localStorage.getItem('my_model') || 'gemini-3.1-flash';
      const temp = localStorage.getItem('my_temp') || '0.6';
      const safety = localStorage.getItem('my_safety') || 'BLOCK_NONE';
      const user = localStorage.getItem('my_user') || 'Vikas M';

      document.getElementById('apiKeysInput').value = keys;
      document.getElementById('sbUrl').value = url;
      document.getElementById('sbKey').value = sbKey;
      document.getElementById('vaultInput').value = vault;
      document.getElementById('modelSelect').value = model;
      document.getElementById('headerModel').innerText = model;
      document.getElementById('tempSlider').value = temp;
      document.getElementById('tempValue').innerText = temp;
      document.getElementById('safetySelect').value = safety;
      document.getElementById('userNameInput').value = user;
      document.getElementById('userNameDisplay').innerText = user;
      document.getElementById('userAvatar').innerText = user.substring(0, 2).toUpperCase();

      apiKeys = keys.split('\n').map(k => k.trim()).filter(k => k);
      if (url && sbKey) initSupabase(url, sbKey);
    }

    function saveAllSettings() {
      const keys = document.getElementById('apiKeysInput').value;
      const url = document.getElementById('sbUrl').value.trim();
      const sbKey = document.getElementById('sbKey').value.trim();
      const vault = document.getElementById('vaultInput').value.trim();
      const model = document.getElementById('modelSelect').value;
      const temp = document.getElementById('tempSlider').value;
      const safety = document.getElementById('safetySelect').value;
      const user = document.getElementById('userNameInput').value.trim() || 'Vikas M';

      localStorage.setItem('my_ai_keys', keys);
      localStorage.setItem('my_sb_url', url);
      localStorage.setItem('my_sb_key', sbKey);
      localStorage.setItem('my_vault', vault);
      localStorage.setItem('my_model', model);
      localStorage.setItem('my_temp', temp);
      localStorage.setItem('my_safety', safety);
      localStorage.setItem('my_user', user);

      loadStoredSettings();
      toggleSettings();
      alert('Settings Saved Successfully!');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }

    function toggleSettings() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function initSupabase(url, key) {
      try {
        supabaseClient = supabase.createClient(url, key);
        loadChatHistory();
      } catch (err) {
        console.error('Supabase error:', err);
      }
    }

    async function loadChatHistory() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('chats').select('id, title, created_at').order('created_at', { ascending: false });
      if (data) {
        const list = document.getElementById('chatHistoryList');
        list.innerHTML = '';
        data.forEach(c => {
          const btn = document.createElement('button');
          btn.className = "w-full text-left px-3 py-2.5 text-xs text-gray-300 hover:bg-[#1a1a1a] rounded-xl truncate transition";
          btn.innerText = "💬 " + (c.title || "Untitled Chat");
          btn.onclick = () => switchChat(c.id);
          list.appendChild(btn);
        });
      }
    }

    function updateTurnCounter() {
      const count = messages.length;
      const badge = document.getElementById('turnCounter');
      badge.innerText = `${count}/60`;
      if (count >= 55) {
        badge.className = "text-xs bg-amber-950/60 border border-amber-500/50 text-amber-400 px-2.5 py-1 rounded-full animate-pulse";
      } else {
        badge.className = "text-xs bg-[#171717] border border-[#2d2d2d] text-gray-400 px-2.5 py-1 rounded-full";
      }
    }

    function newChat() {
      currentChatId = crypto.randomUUID();
      messages = [];
      updateTurnCounter();
      document.getElementById('chatContainer').innerHTML = `
        <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center space-y-3 pt-32">
          <div class="w-14 h-14 rounded-full bg-[#171717] border border-[#262626] flex items-center justify-center shadow-lg">
            <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
          </div>
          <h2 class="text-xl font-semibold text-gray-200">How can I help you today?</h2>
        </div>`;
      lucide.createIcons();
      toggleSidebar();
    }

    async function switchChat(id) {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('chats').select('*').eq('id', id).single();
      if (data) {
        currentChatId = data.id;
        messages = data.messages || [];
        updateTurnCounter();
        const container = document.getElementById('chatContainer');
        container.innerHTML = '';
        messages.forEach(m => renderMessage(m.role, m.content));
        toggleSidebar();
      }
    }

    function renderMessage(role, content) {
      const welcome = document.getElementById('welcomeScreen');
      if (welcome) welcome.remove();

      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'bg-[#212121] text-white px-4 py-3 rounded-2xl max-w-[85%] text-sm'
        : 'text-[#ececec] max-w-full text-sm leading-relaxed prose prose-invert';

      bubble.innerHTML = marked.parse(content);
      div.appendChild(bubble);
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;
      if (apiKeys.length === 0) {
        alert('Please open Settings and add your Gemini API Key!');
        toggleSettings();
        return;
      }

      input.value = '';
      input.style.height = 'auto';

      messages.push({ role: 'user', content: text });
      renderMessage('user', text);
      updateTurnCounter();

      const container = document.getElementById('chatContainer');
      const thinkDiv = document.createElement('div');
      thinkDiv.className = "text-xs text-gray-500 italic flex items-center space-x-2";
      thinkDiv.innerHTML = `<span>💭 Analyzing scene continuity...</span>`;
      container.appendChild(thinkDiv);
      container.scrollTop = container.scrollHeight;

      // 60-Turn Sliding Window + Vault Payload
      const vaultLore = localStorage.getItem('my_vault') || '';
      let payload = [];
      if (vaultLore) {
        payload.push({ role: 'user', parts: [{ text: `[LORE VAULT & STORY BIBLE]:\n${vaultLore}` }] });
        payload.push({ role: 'model', parts: [{ text: "Understood. I will strictly obey the lore vault and continuity." }] });
      }

      messages.slice(-60).forEach(m => {
        payload.push({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content }]
        });
      });

      const modelName = localStorage.getItem('my_model') || 'gemini-3.1-flash';
      const tempVal = parseFloat(localStorage.getItem('my_temp') || '0.6');
      const safetyVal = localStorage.getItem('my_safety') || 'BLOCK_NONE';

      let fullResponse = "";
      let success = false;

      // Failover across API keys
      for (let i = 0; i < apiKeys.length; i++) {
        const key = apiKeys[(activeKeyIndex + i) % apiKeys.length];
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:streamGenerateContent?alt=sse&key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: payload,
              generationConfig: { temperature: tempVal },
              safetySettings: [
                { category: "HARM_CATEGORY_HARASSMENT", threshold: safetyVal },
                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: safetyVal },
                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: safetyVal },
                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: safetyVal }
              ]
            })
          });

          if (!res.ok) continue;

          thinkDiv.remove();
          const reader = res.body.getReader();
          const decoder = new TextDecoder();

          const aiDiv = document.createElement('div');
          aiDiv.className = "text-[#ececec] text-sm leading-relaxed prose prose-invert";
          container.appendChild(aiDiv);

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            for (const line of chunk.split('\n')) {
              if (line.startsWith('data: ')) {
                try {
                  const json = JSON.parse(line.substring(6));
                  const txt = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
                  fullResponse += txt;
                  aiDiv.innerHTML = marked.parse(fullResponse);
                  container.scrollTop = container.scrollHeight;
                } catch(e) {}
              }
            }
          }
